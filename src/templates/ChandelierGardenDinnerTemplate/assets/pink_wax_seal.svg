<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Pink base gradient -->
    <radialGradient id="pinkBase" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="18%" stop-color="#fcf1f3" stop-opacity="1"/>
      <stop offset="38%" stop-color="#f5e0e6" stop-opacity="1"/>
      <stop offset="60%" stop-color="#eac8d3" stop-opacity="1"/>
      <stop offset="80%" stop-color="#ddb4c2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c997a8" stop-opacity="1"/>
    </radialGradient>

    <!-- Highlight shimmer -->
    <radialGradient id="shimmer" cx="30%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep shadow at bottom -->
    <radialGradient id="shadowGrad" cx="50%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#a88290" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a88290" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#403038" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <clipPath id="circleClip">
      <circle cx="150" cy="150" r="136"/>
    </clipPath>
  </defs>

  <!-- Main seal circle with drop shadow -->
  <g filter="url(#dropShadow)">
    <circle cx="150" cy="150" r="136" fill="url(#pinkBase)"/>
  </g>

  <!-- Shimmer highlight layer -->
  <circle cx="150" cy="150" r="136" fill="url(#shimmer)" clip-path="url(#circleClip)"/>

  <!-- Bottom shadow -->
  <circle cx="150" cy="150" r="136" fill="url(#shadowGrad)" clip-path="url(#circleClip)"/>

  <!-- Outer embossed ring - highlight -->
  <circle cx="150" cy="150" r="128" fill="none"
    stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.7"
    clip-path="url(#circleClip)"/>

  <!-- Outer embossed ring - shadow -->
  <circle cx="150" cy="150" r="126" fill="none"
    stroke="#b898a4" stroke-width="1.5" stroke-opacity="0.4"
    clip-path="url(#circleClip)"/>

  <!-- Inner ring - highlight -->
  <circle cx="150" cy="150" r="112" fill="none"
    stroke="#ffffff" stroke-width="2" stroke-opacity="0.55"
    clip-path="url(#circleClip)"/>

  <!-- Inner ring - shadow -->
  <circle cx="150" cy="150" r="110" fill="none"
    stroke="#b898a4" stroke-width="1" stroke-opacity="0.4"
    clip-path="url(#circleClip)"/>
</svg>
