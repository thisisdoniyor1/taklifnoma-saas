<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Pearl base gradient -->
    <radialGradient id="pearlBase" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="18%" stop-color="#f0eaf4" stop-opacity="1"/>
      <stop offset="38%" stop-color="#ddd4e8" stop-opacity="1"/>
      <stop offset="60%" stop-color="#c8bdd8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#b8aece" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a89ec0" stop-opacity="1"/>
    </radialGradient>

    <!-- Highlight shimmer -->
    <radialGradient id="shimmer" cx="30%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#f5f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink blush accent -->
    <radialGradient id="blush" cx="70%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#f0d8e8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0d8e8" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep shadow at bottom -->
    <radialGradient id="shadowGrad" cx="50%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8878a8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8878a8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6060808" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Inner emboss filter -->
    <filter id="emboss" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset dx="1" dy="1.5" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- Clip path for circle -->
    <clipPath id="circleClip">
      <circle cx="150" cy="150" r="136"/>
    </clipPath>
  </defs>

  <!-- Main seal circle with drop shadow -->
  <g filter="url(#dropShadow)">
    <circle cx="150" cy="150" r="136" fill="url(#pearlBase)"/>
  </g>

  <!-- Shimmer highlight layer -->
  <circle cx="150" cy="150" r="136" fill="url(#shimmer)" clip-path="url(#circleClip)"/>

  <!-- Pink blush accent -->
  <circle cx="150" cy="150" r="136" fill="url(#blush)" clip-path="url(#circleClip)"/>

  <!-- Bottom shadow -->
  <circle cx="150" cy="150" r="136" fill="url(#shadowGrad)" clip-path="url(#circleClip)"/>

  <!-- Outer embossed ring - highlight -->
  <circle cx="150" cy="150" r="128" fill="none"
    stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.7"
    clip-path="url(#circleClip)"/>

  <!-- Outer embossed ring - shadow -->
  <circle cx="150" cy="150" r="126" fill="none"
    stroke="#9888b8" stroke-width="1.5" stroke-opacity="0.35"
    clip-path="url(#circleClip)"/>

  <!-- Dashed decorative ring -->
  <circle cx="150" cy="150" r="120" fill="none"
    stroke="#c0b4d8" stroke-width="1.2" stroke-opacity="0.6"
    stroke-dasharray="3.5 4.5"
    clip-path="url(#circleClip)"/>

  <!-- Inner ring - highlight -->
  <circle cx="150" cy="150" r="112" fill="none"
    stroke="#ffffff" stroke-width="2" stroke-opacity="0.55"
    clip-path="url(#circleClip)"/>

  <!-- Inner ring - shadow -->
  <circle cx="150" cy="150" r="110" fill="none"
    stroke="#9888b8" stroke-width="1" stroke-opacity="0.3"
    clip-path="url(#circleClip)"/>

  <!-- Initials in italic calligraphy style -->
  <!-- Shadow of initials for emboss effect -->
  <text x="152" y="157"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="68"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
    fill="#9080b0"
    fill-opacity="0.25"
    letter-spacing="2">N&amp;J</text>

  <!-- Main initials -->
  <text x="150" y="154"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="68"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
    fill="#5a506e"
    fill-opacity="0.85"
    letter-spacing="2">N&amp;J</text>

  <!-- Highlight on initials top-left -->
  <text x="149" y="152"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="68"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
    fill="#ffffff"
    fill-opacity="0.4"
    letter-spacing="2">N&amp;J</text>

  <!-- Divider line below initials -->
  <line x1="110" y1="168" x2="190" y2="168"
    stroke="#9888b8" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- "Click to open" text -->
  <text x="150" y="188"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11"
    text-anchor="middle"
    fill="#7060908"
    fill-opacity="0.6"
    letter-spacing="3">CLICK TO OPEN</text>

</svg>
